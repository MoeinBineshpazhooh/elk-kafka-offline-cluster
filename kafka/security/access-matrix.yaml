# ============================================================
# Kafka Security Access Matrix
# ============================================================
# Documentation-safe reference configuration.
# Passwords are NEVER stored here.
# All identities and topic names are fictional/sanitized.
#
# Security model:
#   Authentication : SASL/PLAIN
#   Authorization  : Kafka StandardAuthorizer / ACLs
#   Default        : deny when no ACL exists
# ============================================================

cluster:
  name: enterprise-observability-kafka
  mode: kraft
  controllers: 3
  brokers: 3
  client_listener: SASL_PLAINTEXT
  controller_listener: SASL_PLAINTEXT
  sasl_mechanism: PLAIN

principals:
  - kafka-admin
  - broker01
  - broker02
  - broker03
  - controller01
  - controller02
  - controller03
  - filebeat
  - logstash
  - collector
  - akhq
  - app

acl_policy:
  cluster_admin:
    principal: kafka-admin
    permissions: [ALL]
    scope: cluster

  filebeat:
    principal: filebeat
    permissions:
      - topic: demo-application-logs
        actions: [WRITE, DESCRIBE]

  logstash:
    principal: logstash
    permissions:
      - topic: demo-application-logs
        actions: [READ, DESCRIBE]
      - group: demo-logstash-consumers
        actions: [READ]

  collector:
    principal: collector
    permissions:
      - topic: demo-platform-events
        actions: [WRITE, DESCRIBE]

  akhq:
    principal: akhq
    permissions:
      - scope: cluster
        actions: [DESCRIBE]
      - topic: demo-application-logs
        actions: [READ, DESCRIBE]
      - topic: demo-platform-events
        actions: [READ, DESCRIBE]
      - group: demo-akhq-consumers
        actions: [READ]

  application:
    principal: app
    permissions:
      - topic: demo-application-logs
        actions: [WRITE, DESCRIBE]

notes:
  - "Use separate passwords for every principal."
  - "Keep real credentials in a local secret store or ignored client properties file."
  - "The topic and consumer-group names above are fictional portfolio examples."
  - "Adjust permissions when integrating another workload."
