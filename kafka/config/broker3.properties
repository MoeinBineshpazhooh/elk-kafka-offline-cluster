# ============================================================
# Kafka Broker 03 — KRaft / SASL-PLAIN / ACL
# ============================================================
# Role: broker only | node.id: 6
# Documentation address: <BROKER03_HOST>
# Replace all CHANGE_ME_* values before deployment.
# ============================================================

process.roles=broker
node.id=6

# -------------------- Client / inter-broker -------------------
listeners=BROKER://<BROKER03_HOST>:9092
advertised.listeners=BROKER://<BROKER03_HOST>:9092
listener.security.protocol.map=BROKER:SASL_PLAINTEXT,CONTROLLER:SASL_PLAINTEXT
inter.broker.listener.name=BROKER
sasl.enabled.mechanisms=PLAIN
sasl.mechanism.inter.broker.protocol=PLAIN
sasl.mechanism.controller.protocol=PLAIN

# Broker's own identity + all PLAIN users accepted by this broker.
sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="broker03" password="CHANGE_ME_BROKER03_PASSWORD" user_broker01="CHANGE_ME_BROKER01_PASSWORD" user_broker02="CHANGE_ME_BROKER02_PASSWORD" user_broker03="CHANGE_ME_BROKER03_PASSWORD" user_controller01="CHANGE_ME_CONTROLLER01_PASSWORD" user_controller02="CHANGE_ME_CONTROLLER02_PASSWORD" user_controller03="CHANGE_ME_CONTROLLER03_PASSWORD" user_kafka-admin="CHANGE_ME_KAFKA_ADMIN_PASSWORD" user_filebeat="CHANGE_ME_FILEBEAT_PASSWORD" user_logstash="CHANGE_ME_LOGSTASH_PASSWORD" user_akhq="CHANGE_ME_AKHQ_PASSWORD" user_collector="CHANGE_ME_COLLECTOR_PASSWORD" user_app="CHANGE_ME_APP_PASSWORD";

# -------------------- KRaft quorum -----------------------------
controller.listener.names=CONTROLLER
controller.quorum.voters=1@<CONTROLLER01_HOST>:9093,2@<CONTROLLER02_HOST>:9093,3@<CONTROLLER03_HOST>:9093

# -------------------- Authorization ---------------------------
authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
allow.everyone.if.no.acl.found=false
super.users=User:kafka-admin;User:broker01;User:broker02;User:broker03;User:controller01;User:controller02;User:controller03

# -------------------- Storage / durability --------------------
auto.create.topics.enable=false
log.dirs=/var/lib/kafka/data
num.partitions=3
default.replication.factor=3
min.insync.replicas=2
offsets.topic.replication.factor=3
transaction.state.log.replication.factor=3
transaction.state.log.min.isr=2
group.initial.rebalance.delay.ms=0
