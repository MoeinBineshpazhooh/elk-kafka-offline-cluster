cluster.name: portfolio-observability
node.name: es03

# Option B roles: master-eligible + data + ingest
node.roles: [ master, data, ingest ]

path.repo: ["/mnt/snapshots"]

network.host: 192.0.2.33
http.port: 9200
transport.port: 9300

discovery.seed_hosts: ["192.0.2.31:9300", "192.0.2.32:9300", "192.0.2.33:9300"]
cluster.initial_master_nodes: ["es01", "es02", "es03"]

# Monitoring
xpack.monitoring.collection.enabled: true

# Security
xpack.security.enabled: true

# HTTP TLS
xpack.security.http.ssl:
  enabled: true
  keystore.path: certs/es03-http.p12

# Transport TLS
xpack.security.transport.ssl:
  enabled: true
  verification_mode: certificate
  keystore.path: certs/es03-transport.p12
  truststore.path: certs/es03-transport.p12
