# Kafka Controller 03 — KRaft / SASL-PLAIN / ACL
process.roles=controller
node.id=3

# Controller listener
listeners=CONTROLLER://192.0.2.13:9093
controller.listener.names=CONTROLLER
listener.security.protocol.map=CONTROLLER:SASL_PLAINTEXT
sasl.enabled.mechanisms=PLAIN
sasl.mechanism.controller.protocol=PLAIN
sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="controller03" password="CHANGE_ME_CONTROLLER03_PASSWORD";

# KRaft quorum
controller.quorum.voters=1@192.0.2.11:9093,2@192.0.2.12:9093,3@192.0.2.13:9093

# Authorization / ACLs
authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
allow.everyone.if.no.acl.found=false
super.users=User:kafka-admin;User:broker01;User:broker02;User:broker03;User:controller01;User:controller02;User:controller03

# Storage
auto.create.topics.enable=false
log.dirs=/var/lib/kafka/data
group.initial.rebalance.delay.ms=0
