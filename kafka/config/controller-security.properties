# ============================================================
# KRaft Controller Security Reference
# ============================================================
# Apply the same security model to controller01/02/03.
# Each controller keeps its own node.id and listener address.
# ============================================================

process.roles=controller

# Controller listener
listeners=CONTROLLER://<CONTROLLER_IP>:9093
controller.listener.names=CONTROLLER

# Three-node KRaft quorum
controller.quorum.voters=1@192.0.2.11:9093,2@192.0.2.12:9093,3@192.0.2.13:9093

# SASL/PLAIN for the controller listener
listener.security.protocol.map=CONTROLLER:SASL_PLAINTEXT
sasl.enabled.mechanisms=PLAIN
sasl.mechanism.controller.protocol=PLAIN

# Controller identity. Use a unique identity/password on each node.
sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="<CONTROLLER_USER>" password="CHANGE_ME_CONTROLLER_PASSWORD";

# ACL authorization
authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
allow.everyone.if.no.acl.found=false
super.users=User:kafka-admin;User:controller01;User:controller02;User:controller03;User:broker01;User:broker02;User:broker03

# Storage
log.dirs=/var/lib/kafka/data
group.initial.rebalance.delay.ms=0
