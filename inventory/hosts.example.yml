# inventory/hosts.example.yml
# Portfolio-only inventory template. Replace placeholders locally.

global:
  project_name: "enterprise-observability-platform"
  environment: "example"
  domain: "<EXAMPLE_DOMAIN>"
  timezone: "<TIMEZONE>"

network:
  management_cidr: "<MANAGEMENT_CIDR>"

ports:
  elasticsearch_http: 9200
  elasticsearch_transport: 9300
  kibana: 5601
  logstash_http_api: 9600
  kafka_broker: 9092
  kafka_controller: 9093
  akhq: 8080
  kafka_ui: 8081

nodes:
  es01:
    ip: "<ES01_IP>"
    hostname: "<ES01_HOST>"
    roles: ["master", "data", "ingest"]
  es02:
    ip: "<ES02_IP>"
    hostname: "<ES02_HOST>"
    roles: ["master", "data", "ingest"]
  es03:
    ip: "<ES03_IP>"
    hostname: "<ES03_HOST>"
    roles: ["master", "data", "ingest"]

  kibana01:
    ip: "<KIBANA01_IP>"
    hostname: "<KIBANA01_HOST>"
    roles: ["kibana", "logstash"]
  kibana02:
    ip: "<KIBANA02_IP>"
    hostname: "<KIBANA02_HOST>"
    roles: ["kibana", "logstash"]

  kafka-controller01:
    ip: "<KAFKA_CONTROLLER01_IP>"
    hostname: "<KAFKA_CONTROLLER01_HOST>"
    roles: ["kafka_controller"]
  kafka-controller02:
    ip: "<KAFKA_CONTROLLER02_IP>"
    hostname: "<KAFKA_CONTROLLER02_HOST>"
    roles: ["kafka_controller"]
  kafka-controller03:
    ip: "<KAFKA_CONTROLLER03_IP>"
    hostname: "<KAFKA_CONTROLLER03_HOST>"
    roles: ["kafka_controller"]

  kafka-broker01:
    ip: "<KAFKA_BROKER01_IP>"
    hostname: "<KAFKA_BROKER01_HOST>"
    roles: ["kafka_broker"]
  kafka-broker02:
    ip: "<KAFKA_BROKER02_IP>"
    hostname: "<KAFKA_BROKER02_HOST>"
    roles: ["kafka_broker"]
  kafka-broker03:
    ip: "<KAFKA_BROKER03_IP>"
    hostname: "<KAFKA_BROKER03_HOST>"
    roles: ["kafka_broker"]

groups:
  elasticsearch: ["es01", "es02", "es03"]
  kibana: ["kibana01", "kibana02"]
  logstash: ["kibana01", "kibana02"]
  kafka_controllers: ["kafka-controller01", "kafka-controller02", "kafka-controller03"]
  kafka_brokers: ["kafka-broker01", "kafka-broker02", "kafka-broker03"]
