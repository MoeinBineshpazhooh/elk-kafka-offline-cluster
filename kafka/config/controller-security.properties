# ============================================================
# KRaft Controller Security Reference
# ============================================================
# Template for controller01/02/03.
# Keep node.id and listener address unique per controller.
# Replace all CHANGE_ME_* values before deployment.
# ============================================================

process.roles=controller

listeners=CONTROLLER://<CONTROLLER_HOST>:9093
controller.listener.names=CONTROLLER
controller.quorum.voters=1@<CONTROLLER01_HOST>:9093,2@<CONTROLLER02_HOST>:9093,3@<CONTROLLER03_HOST>:9093

listener.security.protocol.map=CONTROLLER:SASL_PLAINTEXT
sasl.enabled.mechanisms=PLAIN
sasl.mechanism.controller.protocol=PLAIN

# Listener-specific PLAIN identity database.
listener.name.controller.plain.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="<CONTROLLER_USER>" password="CHANGE_ME_CONTROLLER_PASSWORD" user_broker01="CHANGE_ME_BROKER01_PASSWORD" user_broker02="CHANGE_ME_BROKER02_PASSWORD" user_broker03="CHANGE_ME_BROKER03_PASSWORD" user_controller01="CHANGE_ME_CONTROLLER01_PASSWORD" user_controller02="CHANGE_ME_CONTROLLER02_PASSWORD" user_controller03="CHANGE_ME_CONTROLLER03_PASSWORD" user_kafka-admin="CHANGE_ME_KAFKA_ADMIN_PASSWORD" user_filebeat="CHANGE_ME_FILEBEAT_PASSWORD" user_logstash="CHANGE_ME_LOGSTASH_PASSWORD" user_akhq="CHANGE_ME_AKHQ_PASSWORD" user_collector="CHANGE_ME_COLLECTOR_PASSWORD" user_app="CHANGE_ME_APP_PASSWORD";

authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
allow.everyone.if.no.acl.found=false
super.users=User:kafka-admin;User:controller01;User:controller02;User:controller03;User:broker01;User:broker02;User:broker03

auto.create.topics.enable=false
log.dirs=/var/lib/kafka/data
group.initial.rebalance.delay.ms=0
