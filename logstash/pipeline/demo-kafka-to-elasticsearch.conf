input {
  kafka {
    bootstrap_servers => "${KAFKA_BOOTSTRAP_SERVERS}"
    topics => ${KAFKA_TOPICS}
    group_id => "${KAFKA_GROUP_ID:demo-logstash-consumers}"
    client_id => "${KAFKA_CLIENT_ID:logstash}"
    auto_offset_reset => "${KAFKA_AUTO_OFFSET_RESET:latest}"
    consumer_threads => ${KAFKA_CONSUMER_THREADS:2}
    decorate_events => "basic"

    # Kafka authentication: SASL/PLAIN
    security_protocol => "${KAFKA_SECURITY_PROTOCOL:SASL_PLAINTEXT}"
    sasl_mechanism => "${KAFKA_SASL_MECHANISM:PLAIN}"
    sasl_jaas_config => "org.apache.kafka.common.security.plain.PlainLoginModule required username=\"${KAFKA_USERNAME}\" password=\"${KAFKA_PASSWORD}\";"

    codec => json
  }
}

filter {
  mutate {
    add_field => {
      "[@metadata][source]" => "kafka"
    }
  }
}

output {
  elasticsearch {
    hosts => [ "${ELASTICSEARCH_HOSTS}" ]
    user => "${ELASTICSEARCH_USERNAME}"
    password => "${ELASTICSEARCH_PASSWORD}"
    ssl_certificate_authorities => "${ELASTICSEARCH_SSL_CACERT}"
    ssl_verification_mode => "${ELASTICSEARCH_SSL_VERIFICATIONMODE:full}"

    # Logstash writes to the Elasticsearch rollover alias.
    # ILM policy: observability-ilm-policy
    # The alias resolves to the current write index; Elasticsearch performs rollover.
    index => "${ELASTICSEARCH_INDEX_ALIAS:demo-logs}"
  }
}
