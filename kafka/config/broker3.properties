# ============================================================
# Kafka Broker 03 — KRaft / SASL-PLAIN / ACL
# ============================================================
# Role: broker only
# Node ID: 6
# Public example address: 192.0.2.23
# Real deployments MUST replace example addresses and placeholders.
# ============================================================

process.roles=broker
node.id=6

# -------------------- Broker listener -------------------------
listeners=BROKER://192.0.2.23:9092
advertised.listeners=BROKER://192.0.2.23:9092

# -------------------- Listener security ----------------------
listener.security.protocol.map=BROKER:SASL_PLAINTEXT,CONTROLLER:SASL_PLAINTEXT
inter.broker.listener.name=BROKER
sasl.enabled.mechanisms=PLAIN
sasl.mechanism.inter.broker.protocol=PLAIN
sasl.mechanism.controller.protocol=PLAIN

# Broker-side login used for inter-broker and controller communication.
# Passwords are placeholders only; never commit real credentials.
sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="broker03" password="CHANGE_ME_BROKER03_PASSWORD";

# -------------------- KRaft controller ------------------------
controller.listener.names=CONTROLLER
controller.quorum.voters=1@192.0.2.11:9093,2@192.0.2.12:9093,3@192.0.2.13:9093

# -------------------- Authorization ---------------------------
authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
allow.everyone.if.no.acl.found=false
super.users=User:kafka-admin;User:broker01;User:broker02;User:broker03;User:controller01;User:controller02;User:controller03

# -------------------- Storage / topic defaults ---------------
log.dirs=/var/lib/kafka/data
num.partitions=3
default.replication.factor=3
min.insync.replicas=2
offsets.topic.replication.factor=3
transaction.state.log.replication.factor=3
transaction.state.log.min.isr=2
group.initial.rebalance.delay.ms=0
