# certificates/elasticsearch/instances.yml
# Input file for elasticsearch-certutil to generate node certificates.
# Replace address and DNS placeholders locally before generating certificates.

instances:
  - name: es01
    dns:
      - es01
      - <ES01_HOST>
    ip:
      - <ES01_IP>

  - name: es02
    dns:
      - es02
      - <ES02_HOST>
    ip:
      - <ES02_IP>

  - name: es03
    dns:
      - es03
      - <ES03_HOST>
    ip:
      - <ES03_IP>
